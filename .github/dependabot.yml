# Dependabot configuration to update npm packages weekly
version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/' # Location of your package.json and package-lock.json
    schedule:
      interval: 'cron'
      cronjob: '0 17 * * 1,2' # At 5pm on Monday and Tuesday - https://crontab.guru/
      timezone: 'America/New_York'
    open-pull-requests-limit: 10 # Optional: prevents PR spam by limiting active updates
    ignore:
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # devvit 1.0.0 is a stray/mistaken publish that outranks the real 0.13.x
      # line by semver. Ignore it so Dependabot doesn't try to "upgrade" to it.
      - dependency-name: 'devvit'
        versions: ['1.0.0']
      - dependency-name: '@devvit/*'
        versions: ['1.0.0']
    groups:
      devvit:
        patterns:
          - 'devvit'
          - '@devvit/*'
      eslint:
        patterns:
          - 'eslint'
          - '@eslint/*'
          - 'typescript-eslint'
      vite:
        patterns:
          - 'vite'
          - '@vitejs/*'
